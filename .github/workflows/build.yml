name: build-windows
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Compila il plugin
        run: >
          msbuild build/windows/EQColorato.vcxproj
          /p:Configuration=Release /p:Platform=x64
          /p:PlatformToolset=v143 /m

      - uses: actions/upload-artifact@v4
        with:
          name: EQColorato-dll
          path: binaries/x64/Release/*.dll
